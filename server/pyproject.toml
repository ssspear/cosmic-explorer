[project]
name = "cosmic-explorer-server"
version = "1.0.0"
description = "Exoplanet & star explorer API — FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0,<1",
    "pytest>=8.3.0,<9",
    "ruff>=0.11.0,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
